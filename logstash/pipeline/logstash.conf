input {
  # Spring services will send JSON logs here (logback-logstash-encoder).
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Normalize timestamp if present (logback-logstash-encoder uses @timestamp).
  if [@timestamp] {
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "spring-logs-%{+YYYY.MM.dd}"
  }

  # Keep a copy in Logstash logs for debugging
  stdout { codec => rubydebug }
}


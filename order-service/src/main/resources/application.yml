server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: order-service
  zipkin:
    base-url: ${ZIPKIN_BASE_URL:http://localhost:9411}
  sleuth:
    sampler:
      probability: 1.0

services:
  payment:
    base-url: ${PAYMENT_BASE_URL:http://localhost:8083}
  user:
    base-url: ${USER_BASE_URL:http://localhost:8081}

logging:
  level:
    root: INFO

logstash:
  host: ${LOGSTASH_HOST:localhost}
  port: ${LOGSTASH_PORT:5000}


services:
  # Zipkin UI + collector for distributed tracing
  zipkin:
    image: openzipkin/zipkin:2.24
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Elasticsearch (single node, security disabled for local dev)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Logstash receives logs from services and ships to Elasticsearch
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5000:5000" # TCP input for logback-logstash-encoder
    environment:
      - xpack.monitoring.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      # Logstash monitoring API on port 9600
      test: ["CMD-SHELL", "curl -f http://localhost:9600/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  user-service:
    build:
      context: ./user-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - ZIPKIN_BASE_URL=http://zipkin:9411
      - APP_NAME=user-service
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
    depends_on:
      zipkin:
        condition: service_healthy
      logstash:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  payment-service:
    build:
      context: ./payment-service
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - ZIPKIN_BASE_URL=http://zipkin:9411
      - APP_NAME=payment-service
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
    depends_on:
      zipkin:
        condition: service_healthy
      logstash:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  order-service:
    build:
      context: ./order-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - USER_BASE_URL=http://user-service:8081
      - PAYMENT_BASE_URL=http://payment-service:8083
      - ZIPKIN_BASE_URL=http://zipkin:9411
      - APP_NAME=order-service
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
    depends_on:
      zipkin:
        condition: service_healthy
      user-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      logstash:
        condition: service_healthy
